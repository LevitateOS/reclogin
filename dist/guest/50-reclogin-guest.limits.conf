# Installed as /etc/security/limits.d/50-reclogin-guest.conf (both OSes).
# docs/reclogin-guest.md, point 3, "Ending the guest's processes", step 4:
# a process limit for the guest, read by pam_limits in the reclogin-guest
# PAM service, so that the uid sweep at logout wins against a fork bomb.
guest  hard  nproc  2048
