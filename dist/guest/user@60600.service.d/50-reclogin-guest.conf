# Installed as /usr/lib/systemd/system/user@60600.service.d/50-reclogin-guest.conf
# (LevitateOS only; AcornOS has no systemd user manager).
#
# The guest's own `systemd --user` and everything it starts (D-Bus activated
# services, Plasma's parts started as user units, `systemd-run --user`) is
# not a child of the desktop process that reclogind locks down
# (src/bin/reclogind/nosetid.rs), so the same rule is set here: no new
# privileges, and no file or folder with the set-user-ID or set-group-ID
# bit can be made or given one (systemd's own seccomp filter for the same
# calls). Without this file a guest could make a set-id copy of a shell
# through a user unit (docs/reclogin-guest.md, point 1; review finding 1).
[Service]
NoNewPrivileges=yes
RestrictSUIDSGID=yes
