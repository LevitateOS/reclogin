# Installed as /etc/ssh/sshd_config.d/50-reclogin-guest.conf (both OSes).
# docs/reclogin-guest.md, point 4, "How other logins as guest are refused":
# a guest could write ~/.ssh/authorized_keys while logged in, and OpenSSH
# does not check for a locked password on key logins. Only read where the
# main sshd_config includes sshd_config.d (to be confirmed for AcornOS's
# openssh-server; otherwise this line belongs in the main file).
DenyUsers guest
