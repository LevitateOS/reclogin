# /etc/reclogin.conf: the login screen's settings (reclogin).
#
# Lines of `key = value`; `#` starts a comment. A key left out takes the
# default shown in its comment. A mistake here never stops the login screen:
# unknown keys and unreadable values are logged and ignored.
#
# autologin = NAME
#     Log this user (or `guest`) in at boot without showing the login screen.
#     If that login fails, the login screen appears. After a logout it
#     appears too. Default: none. The installer writes this line when
#     automatic login is chosen.
#
# autologin_session = NAME
#     The session for automatic login: the session file's name without
#     `.desktop` (as in /usr/share/wayland-sessions or /usr/share/xsessions).
#
# guest = on | off
#     Whether the Guest entry is offered. Default: on.
#
# idle_seconds = N
#     Switch the display off after N seconds without input; 0 never.
#     Default: the system's own setting.
