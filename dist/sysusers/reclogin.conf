# The account the login screen's drawing half (reclogin-greeter) runs as.
# A system account with no login shell and no home of its own ("-": the
# defaults, nologin and /), member of no other group: reclogind opens the
# display and input devices and hands them over, so no device group is
# needed.
u reclogin - "reclogin login screen" - -

# The guest account (docs/reclogin-guest.md, point 1; owner's decision 6):
# one fixed account, uid and gid 60600 (outside the user list's 1000-60000,
# in systemd's unused 60578-61183 band), its own group, no other groups.
# Made locked (!*) and without a home folder: reclogind mounts a fresh
# memory home at /run/reclogin/guest for each guest login. reclogind uses
# the account only when it is exactly this (uid, gid, home, locked).
g guest 60600
u guest 60600:60600 "Guest" /run/reclogin/guest /bin/bash
